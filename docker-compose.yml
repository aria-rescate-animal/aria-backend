# ARIA - local con Docker Compose.
# Servicios: MySQL, IA Service, Backend API y Frontend web.

services:
  # 1. Base de datos MySQL.
  mysql:
    image: mysql:8.0
    container_name: aria-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aria_root_password}
    ports:
      - "3307:3306"
    volumes:
      - aria_mysql_data:/var/lib/mysql
      - ./database/aria_db.sql:/docker-entrypoint-initdb.d/01-aria_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aria_net

  # 2. Microservicio de validacion con IA.
  ia-service:
    build:
      context: ./ia-service
      dockerfile: Dockerfile
    container_name: aria-ia-service
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 4000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aria_net

  # 3. API principal de ARIA.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aria-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ia-service:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aria_root_password}
      DB_NAME: aria_db
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-10}
      DB_CONNECT_RETRY_DELAY_MS: ${DB_CONNECT_RETRY_DELAY_MS:-3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      IA_SERVICE_URL: http://ia-service:4000
      JWT_SECRET: ${JWT_SECRET:-aria_local_jwt_secret}
      SESSION_SECRET: ${SESSION_SECRET:-aria_local_session_secret}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-aria@ariaproyecto.online}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - aria_net

  # 4. Frontend React servido con Nginx.
  frontend:
    build:
      context: "${ARIA_FRONTEND_PATH:-../../Diplomado Frontend/aria-frontend}"
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: aria-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aria_net

networks:
  aria_net:
    driver: bridge

volumes:
  aria_mysql_data:
