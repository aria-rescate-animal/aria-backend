name: ARIA Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validar-codigo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Validar sintaxis del codigo
        run: node --check index.js

      - name: Validar archivos del proyecto
        run: |
          node --check src/routes/auth.routes.js
          node --check src/routes/reportes.routes.js
          node --check src/routes/notificaciones.routes.js
          node --check src/routes/admin.routes.js
          node --check src/controllers/reportes.controller.js
          node --check src/middlewares/auth.middleware.js
          node --check src/config/email.js
          echo "Todos los archivos son validos"
